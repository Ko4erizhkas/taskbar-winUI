name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild BarKit.sln /restore /m /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: BarKit-x64
          path: |
            build/x64/Release/
            !build/x64/Release/**/*.pdb
            !build/x64/Release/**/*.lib
            !build/x64/Release/**/*.exp
          if-no-files-found: error
